<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vigil - AI Risk Operations Center</title>
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        bg: '#0b0f17', panel: '#111826', panel2: '#0e1522', line: '#1f2a3a',
        ink: '#e6edf6', acc: '#4f9cf9',
        low: '#3fb27f', medium: '#e0b743', high: '#f0912d', critical: '#ef4444'
      }}}
    };
  </script>
  <style>
    :root{color-scheme:dark}
    body{background:#0b0f17;color:#e6edf6;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .band-LOW{color:#3fb27f} .bg-LOW{background:#3fb27f}
    .band-MEDIUM{color:#e0b743} .bg-MEDIUM{background:#e0b743}
    .band-HIGH{color:#f0912d} .bg-HIGH{background:#f0912d}
    .band-CRITICAL{color:#ef4444} .bg-CRITICAL{background:#ef4444}
    .chip{border:1px solid var(--c,#1f2a3a);border-radius:999px;padding:2px 8px;font-size:11px;letter-spacing:.04em}
    .panel{background:#111826;border:1px solid #1f2a3a;border-radius:12px}
    .btn{border:1px solid #2a3a52;border-radius:8px;padding:6px 12px;font-size:13px;background:#16202f}
    .btn:hover{background:#1c2940}
    .btn-primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
    .btn-primary:hover{background:#2563eb}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #1a2434}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f93a8}
    tr[role=button]:hover{background:#0e1522;cursor:pointer}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .bar{height:8px;border-radius:4px;background:#1a2434;overflow:hidden}
    .bar>span{display:block;height:100%}
    .scroll{overflow:auto}
    .tl-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
    .fade{animation:f .3s ease}
    @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body x-data="vigil()" x-init="init()" class="min-h-screen">

<!-- ================= HEADER ================= -->
<header class="flex items-center gap-4 px-5 py-3 border-b border-line sticky top-0 bg-bg/95 backdrop-blur z-20">
  <div class="flex items-baseline gap-2 cursor-pointer" @click="go('dashboard')">
    <span class="text-lg font-bold tracking-widest text-acc">VIGIL</span>
    <span class="text-xs text-slate-400">AI Risk Investigator</span>
  </div>
  <span class="chip" style="--c:#3a2a12;color:#e0b743">SYNTHETIC DEMO DATA</span>
  <span class="chip mono" :style="`--c:${health.llm_configured?'#123':'#3a1212'}`"
        :class="health.llm_configured?'text-low':'text-high'"
        x-text="health.llm_configured ? ('LLM: '+health.model) : 'LLM: engine-only fallback'"></span>
  <div class="ml-auto flex items-center gap-2">
    <button class="btn" @click="reset()" :disabled="busy">Reset demo</button>
    <button class="btn btn-primary" @click="simulate()" :disabled="busy">
      <span x-show="!busy">⚡ Simulate attack</span><span x-show="busy">working…</span>
    </button>
    <span class="tl-dot" :class="health.db?'bg-LOW':'bg-CRITICAL'" style="margin:0"></span>
  </div>
</header>

<main class="p-5 max-w-[1500px] mx-auto">

  <!-- ================= DASHBOARD ================= -->
  <section x-show="view==='dashboard'" class="space-y-5 fade">
    <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3">
      <template x-for="m in tiles" :key="m.k">
        <div class="panel p-3">
          <div class="text-xs text-slate-400" x-text="m.label"></div>
          <div class="text-2xl font-semibold mt-1" :class="m.cls" x-text="m.val"></div>
        </div>
      </template>
    </div>

    <div class="grid lg:grid-cols-3 gap-5">
      <div class="panel p-4 lg:col-span-1">
        <div class="text-sm font-semibold mb-3">Risk distribution</div>
        <template x-for="b in ['LOW','MEDIUM','HIGH','CRITICAL']" :key="b">
          <div class="mb-2">
            <div class="flex justify-between text-xs mb-1">
              <span :class="'band-'+b" x-text="b"></span>
              <span class="text-slate-400" x-text="(metrics.risk_distribution?.[b]||0)"></span>
            </div>
            <div class="bar"><span :class="'bg-'+b"
              :style="`width:${pct(metrics.risk_distribution?.[b]||0, metrics.analyzed||1)}%`"></span></div>
          </div>
        </template>
        <div class="text-xs text-slate-500 mt-3" x-text="`${metrics.analyzed||0} of ${metrics.total_transactions||0} transactions scored`"></div>
      </div>

      <div class="panel p-4 lg:col-span-2">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-semibold">Case queue</div>
          <div class="text-xs text-slate-400" x-text="cases.length + ' cases'"></div>
        </div>
        <div class="scroll" style="max-height:340px">
          <table>
            <thead><tr><th>Case</th><th>Customer</th><th>Score</th><th>Band</th><th>Status</th><th>Opened</th></tr></thead>
            <tbody>
              <template x-for="c in cases" :key="c.id">
                <tr role="button" @click="openCase(c.id)">
                  <td class="mono" x-text="c.id"></td>
                  <td class="mono" x-text="c.customer_id"></td>
                  <td><span class="font-semibold" :class="'band-'+c.band" x-text="c.score_at_open"></span></td>
                  <td><span class="chip" :class="'band-'+c.band" x-text="c.band"></span></td>
                  <td class="text-xs" x-text="c.status"></td>
                  <td class="text-xs text-slate-400" x-text="fmt(c.opened_at)"></td>
                </tr>
              </template>
              <tr x-show="!cases.length"><td colspan="6" class="text-slate-500 text-center py-6">No open cases. Trigger one with “Simulate attack”.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel p-4">
      <div class="text-sm font-semibold mb-3">Recent activity</div>
      <div class="scroll" style="max-height:320px">
        <table>
          <thead><tr><th>Time</th><th>Txn</th><th>Customer</th><th>Amount</th><th>City</th><th>Score</th><th>Action</th></tr></thead>
          <tbody>
            <template x-for="t in txns" :key="t.id">
              <tr :class="t.is_attack?'':''">
                <td class="text-xs text-slate-400" x-text="fmt(t.created_at)"></td>
                <td class="mono text-xs" x-text="t.id.slice(0,16)"></td>
                <td class="mono text-xs" x-text="t.customer_id"></td>
                <td x-text="inr(t.amount_paise)"></td>
                <td class="text-xs" x-text="t.city"></td>
                <td><span class="font-semibold" :class="'band-'+(t.band||'')" x-text="t.score ?? '—'"></span></td>
                <td class="text-xs text-slate-400" x-text="t.recommended_action || ''"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ================= CASE DETAIL ================= -->
  <section x-show="view==='case' && detail" class="fade" x-cloak>
    <button class="btn mb-4" @click="go('dashboard')">← Back to dashboard</button>

    <template x-if="detail">
    <div>
      <div class="flex flex-wrap items-center gap-3 mb-4">
        <span class="mono text-lg font-semibold" x-text="detail.case.id"></span>
        <span class="chip" :class="'band-'+detail.case.band" x-text="detail.case.band"></span>
        <span class="chip" style="--c:#26324a" x-text="detail.case.status"></span>
        <span class="text-xs text-slate-400" x-text="'opened '+fmt(detail.case.opened_at)"></span>

        <div class="ml-auto flex flex-wrap gap-2">
          <template x-for="a in actionButtons" :key="a">
            <button class="btn" :class="a===engineAction?'btn-primary':''"
              @click="chooseAction(a)" :disabled="decided" x-text="a.replace(/_/g,' ')"></button>
          </template>
        </div>
      </div>

      <div x-show="pendingAction" class="panel p-3 mb-4" style="border-color:#3a2a12">
        <div class="text-xs mb-2">
          Confirm decision: <b x-text="pendingAction?.replace(/_/g,' ')"></b>
          <span x-show="isOverride" class="band-HIGH">— differs from engine recommendation
            (<span x-text="engineAction?.replace(/_/g,' ')"></span>), reason required</span>
        </div>
        <textarea x-show="isOverride" x-model="overrideReason" rows="2"
          class="w-full bg-panel2 border border-line rounded p-2 text-sm mb-2"
          placeholder="Why are you overriding the engine recommendation?"></textarea>
        <button class="btn btn-primary" @click="submitDecision()"
          :disabled="isOverride && !overrideReason.trim()">Confirm</button>
        <button class="btn" @click="pendingAction=null">Cancel</button>
      </div>

      <div class="grid lg:grid-cols-3 gap-4">

        <!-- LEFT -->
        <div class="space-y-4">
          <div class="panel p-4">
            <div class="text-xs text-slate-400 mb-2">TRANSACTION</div>
            <div class="text-2xl font-semibold" x-text="inr(detail.transaction.amount_paise)"></div>
            <div class="text-sm text-slate-300" x-text="detail.transaction.city + ' · ' + detail.transaction.method.toUpperCase()"></div>
            <div class="text-xs text-slate-400 mt-1" x-text="fmt(detail.transaction.created_at)"></div>
            <div class="text-xs mono mt-2 text-slate-400" x-text="'device '+detail.transaction.device_id + (detail.transaction.ip_addr? ' · ip '+detail.transaction.ip_addr:'')"></div>
            <div x-show="detail.transaction.scenario_label" class="chip mt-2 inline-block band-CRITICAL" style="--c:#3a1212"
                 x-text="'ground truth: '+detail.transaction.scenario_label"></div>
          </div>

          <div class="panel p-4">
            <div class="text-xs text-slate-400 mb-2">CUSTOMER</div>
            <div class="mono" x-text="detail.customer.id"></div>
            <div class="text-sm" x-text="'KYC tier '+detail.customer.kyc_tier+' · '+detail.customer.segment"></div>
            <div class="text-xs text-slate-400 mt-2">Baseline</div>
            <ul class="text-xs text-slate-300 space-y-0.5 mt-1">
              <li x-text="detail.customer.txn_count+' transactions on record'"></li>
              <li x-text="'median '+inr(detail.customer.amount_median_paise)+' · p95 '+inr(detail.customer.amount_p95_paise)"></li>
              <li x-text="'home '+detail.customer.home_city+' · active '+detail.customer.active_hour_start+':00–'+detail.customer.active_hour_end+':00'"></li>
              <li x-text="(detail.customer.known_device_ids||[]).length+' known device(s): '+(detail.customer.known_device_ids||[]).join(', ')"></li>
            </ul>
          </div>

          <div class="panel p-4">
            <div class="text-xs text-slate-400 mb-2">RELATED EVENTS</div>
            <template x-if="detail.related_events.length">
              <div class="space-y-1">
                <template x-for="r in detail.related_events" :key="r.transaction_id">
                  <div class="text-xs flex justify-between gap-2 border-b border-line pb-1">
                    <span class="mono" x-text="r.link_type"></span>
                    <span class="mono" x-text="r.customer_id"></span>
                    <span x-text="inr(r.amount_paise)"></span>
                  </div>
                </template>
                <div class="text-xs band-HIGH mt-2" x-show="ringCustomers>1"
                  x-text="'Same device on '+ringCustomers+' other customers — possible fraud ring'"></div>
              </div>
            </template>
            <div x-show="!detail.related_events.length" class="text-xs text-slate-500">None found.</div>
          </div>
        </div>

        <!-- MIDDLE -->
        <div class="space-y-4">
          <div class="panel p-4">
            <div class="flex items-end gap-4">
              <div>
                <div class="text-xs text-slate-400">RISK SCORE</div>
                <div class="text-5xl font-bold" :class="'band-'+detail.assessment.band"
                     x-text="detail.assessment.score"></div>
                <div class="text-sm font-semibold" :class="'band-'+detail.assessment.band" x-text="detail.assessment.band"></div>
              </div>
              <div class="text-xs text-slate-400 pb-1">
                <div x-text="'engine v'+ (detail.assessment.engine_version||'1.0')"></div>
                <div x-text="'recommends: '+detail.assessment.recommended_action.replace(/_/g,' ')"></div>
                <div x-text="detail.assessment.latency_ms+' ms'"></div>
              </div>
            </div>

            <div class="text-xs text-slate-400 mt-4 mb-2">WHY THIS SCORE</div>
            <template x-for="s in sortedSignals" :key="s.code">
              <div class="mb-2" x-show="s.contribution_pct>0 || s.triggered">
                <div class="flex justify-between text-xs mb-1">
                  <span class="mono" x-text="s.code"></span>
                  <span class="text-slate-400" x-text="Math.round(s.contribution_pct)+'%'"></span>
                </div>
                <div class="bar"><span class="bg-HIGH" :style="`width:${s.contribution_pct}%`"></span></div>
                <div class="text-[11px] text-slate-400 mt-1" x-text="s.explanation"></div>
              </div>
            </template>

            <template x-if="detail.assessment.rules_fired?.length">
              <div class="mt-3 p-2 rounded" style="background:#1a1206">
                <template x-for="r in detail.assessment.rules_fired" :key="r.code">
                  <div class="text-xs band-HIGH">
                    ⚠ Rule <span class="mono" x-text="r.code"></span> — floor <span x-text="r.floor"></span>
                    <div class="text-[11px] text-slate-300" x-text="r.detail"></div>
                  </div>
                </template>
                <div class="text-[11px] text-slate-400 mt-1"
                  x-text="'base score '+detail.assessment.base_score+' → '+detail.assessment.score+' after rule floor'"></div>
              </div>
            </template>
          </div>

          <div class="panel p-4">
            <div class="text-xs text-slate-400 mb-2">TIMELINE</div>
            <div class="space-y-2">
              <template x-for="(e,i) in detail.timeline" :key="i">
                <div class="flex gap-2 text-xs">
                  <span class="tl-dot" :class="{'bg-LOW':e.severity==='info','bg-MEDIUM':e.severity==='warn','bg-CRITICAL':e.severity==='danger'}"></span>
                  <span class="text-slate-400 mono flex-none" x-text="clock(e.ts)"></span>
                  <span x-text="e.label"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="space-y-4">
          <div class="panel p-4">
            <div class="flex items-center justify-between mb-2">
              <div class="text-xs text-slate-400">AI INVESTIGATION</div>
              <button class="btn btn-primary" @click="investigate()" :disabled="investigating || !!lastRun"
                x-text="investigating ? 'investigating…' : (lastRun ? 'complete' : 'Investigate')"></button>
            </div>

            <template x-if="lastRun">
              <div class="space-y-3">
                <div class="flex flex-wrap gap-2 text-xs">
                  <span class="chip mono" style="--c:#26324a" x-text="lastRun.mode==='llm' ? lastRun.model : 'engine-only'"></span>
                  <span class="chip mono" style="--c:#26324a" x-text="lastRun.tool_call_count+' tool calls'"></span>
                  <span class="chip mono" style="--c:#26324a" x-text="lastRun.latency_ms+' ms'"></span>
                  <span class="chip" :class="lastRun.grounding_verdict==='PASS'?'band-LOW':(lastRun.grounding_verdict==='PARTIAL'?'band-MEDIUM':'band-CRITICAL')"
                    x-text="'grounding '+lastRun.grounding_verdict"></span>
                </div>

                <div x-show="lastRun.tool_log?.length">
                  <div class="text-[11px] text-slate-400 mb-1">EVIDENCE GATHERING</div>
                  <template x-for="tc in lastRun.tool_log" :key="tc.seq">
                    <div class="text-[11px] mono flex justify-between border-b border-line py-0.5">
                      <span>▸ <span x-text="tc.tool"></span></span>
                      <span class="text-slate-400" x-text="(tc.summary||'')+' · '+(tc.ms||0)+'ms'"></span>
                    </div>
                  </template>
                </div>

                <div>
                  <div class="text-[11px] text-slate-400 mb-1">SUMMARY</div>
                  <div class="text-xs text-slate-200" x-text="lastRun.summary"></div>
                </div>

                <div>
                  <div class="text-[11px] text-slate-400 mb-1 flex justify-between">
                    <span>FINDINGS</span>
                    <span :class="lastRun.claims_verified===lastRun.claims_total?'band-LOW':'band-MEDIUM'"
                      x-text="'✓ '+lastRun.claims_verified+'/'+lastRun.claims_total+' claims verified'"></span>
                  </div>
                  <template x-for="(f,i) in lastRun.findings" :key="i">
                    <div class="text-xs border border-line rounded p-2 mb-1">
                      <div class="flex justify-between gap-2">
                        <span class="font-medium" x-text="f.title"></span>
                        <span class="chip flex-none" :class="{
                          'band-LOW':f.validation_status==='VERIFIED',
                          'band-MEDIUM':f.validation_status==='UNVERIFIED',
                          'band-CRITICAL':f.validation_status==='REFUTED'}"
                          x-text="f.validation_status"></span>
                      </div>
                      <div class="text-[11px] text-slate-400 mt-1" x-text="f.detail"></div>
                      <div class="text-[11px] mono text-slate-500 mt-1" x-show="f.evidence_refs?.length"
                        x-text="'evidence: '+f.evidence_refs.join(', ')"></div>
                    </div>
                  </template>
                </div>

                <div class="p-2 rounded" style="background:#0e1522">
                  <div class="text-xs">ENGINE: <b x-text="engineAction.replace(/_/g,' ')"></b></div>
                  <div class="text-xs mt-0.5">AGENT: <b x-text="lastRun.recommended_action.replace(/_/g,' ')"></b>
                    <span x-show="!lastRun.concurs_with_engine" class="band-HIGH">⚡ dissents</span>
                  </div>
                  <div class="text-[11px] text-slate-400 mt-1" x-show="lastRun.dissent_reason" x-text="lastRun.dissent_reason"></div>
                  <div class="text-[11px] text-slate-400 mt-1"
                    x-text="'confidence '+Math.round(lastRun.confidence*100)+'% · '+(lastRun.requires_human_review?'human review required':'no review required')"></div>
                </div>
              </div>
            </template>
            <div x-show="!lastRun && !investigating" class="text-xs text-slate-500">
              Not yet investigated. Click “Investigate” to dispatch the agent.
            </div>
          </div>

          <div class="panel p-4">
            <button class="text-xs text-slate-400 w-full text-left" @click="showEvidence=!showEvidence"
              x-text="(showEvidence?'▾':'▸')+' EVIDENCE LEDGER ('+detail.evidence.length+')'"></button>
            <div x-show="showEvidence" class="mt-2 space-y-1">
              <template x-for="ev in detail.evidence" :key="ev.id">
                <div class="text-[11px] border-b border-line py-1">
                  <span class="mono" x-text="ev.id"></span> ·
                  <span x-text="ev.metric"></span>
                  <span x-show="ev.verified" class="band-LOW">✓</span>
                  <div class="text-slate-500" x-text="ev.detail"></div>
                </div>
              </template>
            </div>
          </div>

          <div class="panel p-4">
            <button class="text-xs text-slate-400 w-full text-left" @click="showAudit=!showAudit"
              x-text="(showAudit?'▾':'▸')+' AUDIT TRAIL ('+detail.audit.length+')'"></button>
            <div x-show="showAudit" class="mt-2 space-y-1">
              <template x-for="a in detail.audit" :key="a.id">
                <div class="text-[11px] flex gap-2 border-b border-line py-1">
                  <span class="text-slate-500 mono flex-none" x-text="clock(a.created_at)"></span>
                  <span class="flex-none text-slate-400" x-text="a.actor"></span>
                  <span x-text="a.action"></span>
                </div>
              </template>
            </div>
          </div>

          <div class="panel p-4" x-show="detail.decisions.length">
            <div class="text-xs text-slate-400 mb-2">DECISIONS</div>
            <template x-for="d in detail.decisions" :key="d.id">
              <div class="text-xs border-b border-line py-1">
                <b x-text="d.decision"></b> → <span x-text="d.final_action.replace(/_/g,' ')"></span>
                <span class="text-slate-400" x-text="' by '+d.actor"></span>
                <div class="text-[11px] band-HIGH" x-show="d.override_reason" x-text="'override: '+d.override_reason"></div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
    </template>
  </section>

  <div x-show="error" class="fixed bottom-4 right-4 panel p-3 text-xs band-CRITICAL" style="border-color:#3a1212" x-text="error"></div>
</main>

<script>
function vigil() {
  return {
    view: 'dashboard', busy: false, error: '',
    health: {db:true, llm_configured:false, model:''},
    metrics: {}, cases: [], txns: [],
    detail: null, investigating: false,
    pendingAction: null, overrideReason: '', showEvidence:false, showAudit:false,

    async init() {
      await this.refreshHealth();
      await this.loadDashboard();
      setInterval(() => { if (this.view==='dashboard') this.loadDashboard(true); }, 5000);
    },
    async api(path, opts) {
      const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
      if (!r.ok) { const t = await r.text(); this.flash(`${r.status}: ${t.slice(0,140)}`); throw new Error(t); }
      return r.status===204 ? null : r.json();
    },
    flash(m){ this.error=m; setTimeout(()=>this.error='',6000); },

    async refreshHealth(){ try{ this.health = await this.api('/api/health'); }catch(e){} },
    async loadDashboard(quiet){
      try{
        const [m,c,t] = await Promise.all([
          this.api('/api/dashboard/metrics'),
          this.api('/api/cases'),
          this.api('/api/transactions?limit=40'),
        ]);
        this.metrics=m; this.cases=c; this.txns=t;
      }catch(e){ if(!quiet) this.flash('Failed to load dashboard'); }
    },
    async openCase(id){
      try{ this.detail = await this.api('/api/cases/'+id); this.view='case';
        this.pendingAction=null; this.overrideReason=''; window.scrollTo(0,0);
      }catch(e){ this.flash('Failed to open case'); }
    },
    go(v){ this.view=v; if(v==='dashboard') this.loadDashboard(); },

    async simulate(){
      this.busy=true;
      try{
        const r = await this.api('/api/simulate/scenario',{method:'POST',body:JSON.stringify({scenario:'account_takeover'})});
        await this.loadDashboard();
        if(r.case_id) await this.openCase(r.case_id);
      }catch(e){} finally{ this.busy=false; }
    },
    async reset(){
      this.busy=true;
      try{ await this.api('/api/admin/reset',{method:'POST',body:'{}'}); this.view='dashboard'; await this.loadDashboard(); }
      catch(e){} finally{ this.busy=false; }
    },
    async investigate(){
      if(!this.detail) return;
      this.investigating=true;
      try{
        await this.api('/api/cases/'+this.detail.case.id+'/investigate',{method:'POST',body:'{}'});
        this.detail = await this.api('/api/cases/'+this.detail.case.id);
      }catch(e){ this.flash('Investigation failed'); }
      finally{ this.investigating=false; }
    },

    chooseAction(a){ this.pendingAction=a; if(!this.isOverride) this.overrideReason=''; },
    async submitDecision(){
      const a=this.pendingAction; if(!a) return;
      const decision = this.isOverride ? 'OVERRIDE' : (a==='BLOCK'||a==='HOLD_FOR_REVIEW' ? 'REJECT' : 'APPROVE');
      try{
        await this.api('/api/cases/'+this.detail.case.id+'/decision',{method:'POST',
          body:JSON.stringify({decision, final_action:a, override_reason:this.overrideReason||null})});
        this.pendingAction=null; this.overrideReason='';
        this.detail = await this.api('/api/cases/'+this.detail.case.id);
      }catch(e){}
    },

    // ---- derived ----
    get tiles(){ const m=this.metrics; return [
      {k:'t',label:'Transactions',val:m.total_transactions??'—'},
      {k:'a',label:'Analysed',val:m.analyzed??'—'},
      {k:'s',label:'Suspicious',val:m.suspicious??'—',cls:'band-MEDIUM'},
      {k:'h',label:'High risk',val:m.high_risk??'—',cls:'band-HIGH'},
      {k:'c',label:'Critical',val:m.critical??'—',cls:'band-CRITICAL'},
      {k:'r',label:'Need review',val:m.review_required??'—',cls:'band-HIGH'},
      {k:'d',label:'Detection rate',val:m.detection_rate!=null?Math.round(m.detection_rate*100)+'%':'—',cls:'band-LOW'},
      {k:'m',label:'Median time-to-decision',val:m.median_time_to_decision_s!=null?m.median_time_to_decision_s+'s':'—'},
    ];},
    get sortedSignals(){ return [...(this.detail?.assessment?.signals||[])].sort((a,b)=>b.contribution_pct-a.contribution_pct); },
    get lastRun(){ const r=this.detail?.runs||[]; return r.length? r[r.length-1] : null; },
    get engineAction(){ return this.detail?.assessment?.recommended_action || ''; },
    get actionButtons(){ return ['ALLOW','MONITOR','STEP_UP_AUTH','HOLD_FOR_REVIEW','BLOCK']; },
    get isOverride(){ return this.pendingAction && this.pendingAction !== this.engineAction; },
    get decided(){ return (this.detail?.decisions||[]).length>0; },
    get ringCustomers(){ const s=new Set((this.detail?.related_events||[]).filter(r=>r.link_type==='shared_device').map(r=>r.customer_id)); return s.size; },

    // ---- format ----
    inr(p){ return '₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:0}); },
    pct(n,d){ return Math.min(100, Math.round(100*n/(d||1))); },
    fmt(s){ const d=new Date(s); return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); },
    clock(s){ return new Date(s).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); },
  }
}
</script>
<style>[x-cloak]{display:none!important}</style>
